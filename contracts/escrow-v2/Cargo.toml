[package]
name = "micopay-escrow-v2"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Booking escrow for MicoPay Rentas: cancellation policy, damage deposit, arbiter and default payout."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "26.1.1"

[dev-dependencies]
soroban-sdk = { version = "26.1.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
